[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "credence-risk-py"
description = "Credence Finance risk-core (Rust) for Python: bit-identical to the Stylus Risk Engine"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]

[tool.maturin]
module-name = "credence_risk"
features = ["pyo3/extension-module"]
