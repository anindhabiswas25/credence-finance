[package]
name = "credence-common"
description = "Shared plumbing for Credence off-chain services: env config, telemetry, ops HTTP server, signers (AWS KMS / local), calendar, retry, Postgres."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
alloy = { workspace = true, features = ["signer-local", "signer-keystore"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
