# Solidity CI (owner: BE-chain). Build Guide §5: forge fmt / build / test / coverage, slither, gas snapshot diff.
name: contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", "deployments/abis/**", "mk/contracts.mk", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", "deployments/abis/**", "mk/contracts.mk", ".github/workflows/contracts.yml"]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Dependencies (pinned tags)
        run: make contracts-deps
      - name: Format
        run: make contracts-fmt-check
      - name: Build (+ contract sizes)
        run: cd contracts && forge build --sizes
      - name: Frozen ABIs are up to date
        run: make abis-export abis-check && git diff --exit-code deployments/abis
      - name: Unit, fuzz (10k), invariants (512 × 256), scenarios
        run: cd contracts && forge test -vv
      - name: Gas snapshot diff (default profile, as generated by `make contracts-snapshot`)
        env:
          FOUNDRY_PROFILE: default
        run: cd contracts && forge snapshot --check --tolerance 1 --no-match-path 'test/invariant/*'

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOUNDRY_PROFILE: default
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: make contracts-deps
      - name: Coverage ≥ 95% lines on src/core, src/governance, src/clock and src/oracle
        run: make contracts-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: contracts/lcov.info

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: make contracts-deps
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          fail-on: high
          slither-args: --filter-paths "lib/|test/|script/"
