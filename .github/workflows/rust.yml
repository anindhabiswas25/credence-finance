# Risk math + Stylus CI (owner: BE-chain). Build Guide §5: fmt, clippy -D warnings, test, cargo stylus check,
# size check (one Stylus code fragment), ABI parity with IRiskEngine.sol, differential run on a devnode.
name: rust

on:
  push:
    branches: [main]
    paths: ["crates/risk-*/**", "stylus/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml",
            "deployments/abis/**", "mk/contracts.mk", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/risk-*/**", "stylus/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml",
            "deployments/abis/**", "mk/contracts.mk", ".github/workflows/rust.yml"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt + clippy -D warnings
        run: make risk-lint
      - name: risk-core golden vectors G-01..G-22, proptests, risk-cli
        run: make risk-test
      - name: Stylus engine (native TestVM)
        run: make stylus-test
      - name: Engine ABI == IRiskEngine.sol
        run: make stylus-abi-check

  stylus-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - name: Pinned nightly for the on-chain build (ADR-0102)
        run: rustup toolchain install nightly-2025-08-01 --profile minimal -c rust-src -t wasm32-unknown-unknown
      - name: cargo-stylus
        run: cargo install --locked cargo-stylus@0.10.9
      - name: Two clones at different paths build byte-identical WASM (R-24)
        run: make stylus-repro

  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: wasm-pack 0.15.0
        run: cargo install --locked wasm-pack@0.15.0
      - name: risk-py (maturin, abi3) smoke test vs risk-cli
        run: make risk-py-test
      - name: risk-wasm (node + web builds) smoke test vs risk-cli
        run: make risk-wasm-test
      - name: ADR-0106 example bundle validates
        run: make risk-validate-set

  stylus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Pinned nightly for the on-chain build (ADR-0102)
        run: rustup toolchain install nightly-2025-08-01 --profile minimal -c rust-src -t wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: cargo-stylus
        run: cargo install --locked cargo-stylus@0.10.9
      - name: nitro-devnode (infra/docker-compose.yml, bootstrapped with the StylusDeployer)
        run: docker compose -f infra/docker-compose.yml up -d --wait devnode devnode-init
      - name: cargo stylus check (activation + single-fragment size, both programs)
        run: make stylus-check
      - name: Deploy + activate the split engine (router + PricingEngine + AuctionMath) on the devnode
        run: make devnode-deploy-engine
      - name: Differential 10k per function (0 mismatches) + gas against the §8.9.3 CI limits
        run: make stylus-diff DIFF_N=10000
      - name: Market ↔ Stylus engine integration (vs risk-cli)
        run: make devnode-integration
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stylus-diff-regressions
          path: crates/risk-core/tests/regressions/
