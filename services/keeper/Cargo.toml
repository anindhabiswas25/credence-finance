[package]
name = "credence-keeper"
description = "Credence keeper (Build Guide §10.2): calendar-driven jobs with Postgres idempotency, leader election, nonce management and RPC failover."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "credence-keeper"
path = "src/main.rs"

[dependencies]
credence-common = { path = "../../crates/credence-common" }
credence-risk-core = { path = "../../crates/risk-core", features = ["std", "files"] }
alloy = { workspace = true, features = ["signer-local"] }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.6", features = ["derive", "env"] }
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
# signs LIVE reports in the e2e so the clock has a real price to act on
credence-relayer = { path = "../relayer" }
