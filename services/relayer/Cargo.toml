[package]
name = "credence-relayer"
description = "Credence price relayer (Build Guide §10.1): licensed US equity data → OCR-lite 2-of-3 signed EIP-712 reports → CredencePriceFeed."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "credence-relayer"
path = "src/main.rs"

[dependencies]
credence-common = { path = "../../crates/credence-common" }
alloy = { workspace = true, features = ["signer-local", "json-abi"] }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
async-trait = "0.1"
futures = "0.3"
quick-xml = { version = "0.38", features = ["serialize"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
