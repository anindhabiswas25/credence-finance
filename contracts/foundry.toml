[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = true
bytecode_hash = "none"
# CredenceMarket and its linked logic libraries must fit the 24 KB code-size limit: compile them for size
# (optimizer_runs 200) and everything else for runtime gas (ADR-0107).
additional_compiler_profiles = [{ name = "size", optimizer_runs = 200 }]
compilation_restrictions = [
  { paths = "src/core/CredenceMarket.sol", optimizer_runs = 200 },
  { paths = "src/core/market/*.sol", optimizer_runs = 200 },
]
fs_permissions = [
  { access = "read", path = "../calibration/out" },
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "../deployments" },
]
ffi = false                     # enabled only in profile.ffi

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.coverage]
# coverage builds are unoptimized anyway; one compilation unit keeps the line mapping of the market and its
# libraries exact (the size profile of the default build splits them into a second unit)
additional_compiler_profiles = []
compilation_restrictions = []

[profile.ffi]
ffi = true                      # tests that call crates/risk-cli for exact expected values

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 512, depth = 256, fail_on_revert = false }

[lint]
lint_on_build = false          # forge 1.8 lints on build; run `forge lint` explicitly

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL}"
devnode = "http://127.0.0.1:8547"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api", chain = 421614 }

[fmt]
line_length = 110
int_types = "long"
